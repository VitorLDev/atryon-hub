services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: atryon_hub
      POSTGRES_USER: atryon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-atryon_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atryon -d atryon_hub"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
